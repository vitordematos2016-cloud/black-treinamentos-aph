server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Cabeçalhos defensivos de segurança HTTP
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Compressão Gzip para carregamento ultrarrápido no Mobile e Desktop
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # Cache forte para assets versionados do Vite e imagens da pasta /assets
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Roteamento SPA (Landing, Portal do Aluno e Painel Admin)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Evita cache agressivo no HTML principal para deploys refletirem na hora
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
